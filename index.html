<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>招商复色标准指南 · 大码男装</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --paper:#f3f1ec; --card:#fff; --ink:#15181b; --ink2:#41474d; --muted:#8b9096;
  --line:#e5e1d9; --line2:#efece6;
  --acc:#cf4a1c; --acc-d:#a83a12; --acc-t:#fdf1ea; --acc-b:#f2d9cb;
  --biz:#2c5f7c; --biz-t:#eef4f8;
  --ok:#3f7a52;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(rgba(0,0,0,.028) 1px,transparent 1px);background-size:7px 7px}
a{cursor:pointer;text-decoration:none;color:inherit}
.shell{display:flex;min-height:100vh;align-items:stretch}

/* rail */
.rail{flex:0 0 214px;background:#15181b;color:#fff;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;padding:26px 0 16px}
.brand{padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand .mk{font:700 10px/1 var(--sans);letter-spacing:.28em;color:#7f878f}
.brand h2{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:.02em;margin-top:10px}
.brand p{font-size:10.5px;color:#767e86;letter-spacing:.12em;margin-top:5px}
.toc{overflow-y:auto;padding:12px 10px 0;flex:1}
.toc .grp{font-size:9.5px;letter-spacing:.22em;color:#5e666e;padding:4px 12px 7px}
.ti{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:7px;color:#b9c0c7;cursor:pointer;
  font-size:12.5px;transition:.18s;border-left:2px solid transparent}
.ti:hover{background:rgba(255,255,255,.055);color:#fff}
.ti.on{background:#20252a;color:#fff;border-left-color:var(--acc)}
.ti .n{font-family:var(--serif);font-size:11px;color:#6f777f;min-width:15px}
.ti.on .n{color:var(--acc)}
.ti .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ti .w{font-size:9.5px;color:#6f777f;font-family:var(--serif)}
.rail-foot{padding:12px 22px 0;border-top:1px solid rgba(255,255,255,.09);font-size:9.5px;
  color:#656d75;line-height:1.75;letter-spacing:.03em}

.main{flex:1 1 auto;min-width:0;padding:36px 44px 58px;max-width:1160px}

/* overview */
.kick{font-size:10px;letter-spacing:.3em;color:var(--acc);font-weight:700}
.h1{font-family:var(--serif);font-size:40px;line-height:1.18;font-weight:700;letter-spacing:-.01em;margin:13px 0 0}
.lead{margin-top:13px;font-size:13.5px;color:var(--ink2);max-width:44em}
.lead b{color:var(--ink);border-bottom:1px solid var(--acc);padding-bottom:1px}


.read{margin:24px 0 28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px 23px;
  display:flex;gap:24px;flex-wrap:wrap}
.read > div{flex:1 1 220px;min-width:200px;border-left:1px solid var(--line2);padding-left:17px}
.read > div:first-child{border-left:0;padding-left:0}
.read h4{font-size:11px;letter-spacing:.13em;color:var(--acc);font-weight:700;margin-bottom:6px}
.read p{font-size:12.5px;color:#4d5359;line-height:1.78}
.read p b{color:var(--ink)}

.sh{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 11px;flex-wrap:wrap;gap:8px}
.sh h3{font-family:var(--serif);font-size:19px;font-weight:700}
.sh span{font-size:10px;letter-spacing:.18em;color:var(--muted)}

.otw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.ot{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
table.ot th{font-size:10px;font-weight:600;letter-spacing:.09em;color:var(--muted);text-align:left;
  padding:13px 12px;border-bottom:1px solid var(--line);background:#fbfaf7;white-space:nowrap}
table.ot td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.ot tr:last-child td{border-bottom:0}
table.ot tbody tr{cursor:pointer;transition:background .15s}
table.ot tbody tr:hover{background:#fbf7f3}
.oc{display:flex;align-items:center;gap:9px}
.oc .no{font-family:var(--serif);font-size:10.5px;color:#b9b2a6;min-width:14px}
.oc .nm{font-size:13px;font-weight:600}
.wtag{display:inline-block;font-family:var(--serif);font-size:13px;font-weight:700;color:var(--acc-d);
  background:var(--acc-t);border:1px solid var(--acc-b);border-radius:5px;padding:1px 9px}
.wtag.no{color:#9aa0a6;background:#f6f6f5;border-color:#e8e6e1;font-weight:400}
.rg{font-family:var(--serif);font-size:13.5px}
.rg u{text-decoration:none;color:var(--muted);font-size:10.5px;margin:0 5px}
.rg i{font-style:normal;color:var(--muted);font-size:10.5px;margin-left:2px}
.num{font-family:var(--serif);font-size:14px}
.concl{font-size:11.5px;color:var(--ink2);line-height:1.6;display:block}
.tfoot{padding:10px 14px;background:#fbfaf7;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted)}

/* detail head */
.phead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.pnum{font-family:var(--serif);font-size:44px;line-height:.95;color:#dcd5c8;font-weight:700}
.pname{flex:1 1 220px;min-width:160px}
.pname .bc{font-size:10.5px;letter-spacing:.14em;color:var(--muted)}
.pname h1{font-family:var(--serif);font-size:33px;line-height:1.15;font-weight:700;margin-top:4px}
.pnav{display:flex;align-items:center;gap:6px;padding-top:8px;flex-wrap:wrap}
.pnav .gbtn{font-size:11.5px;color:var(--ink2);border:1px solid var(--line);background:#fff;
  border-radius:20px;padding:3px 12px}
.pnav .gbtn:hover{border-color:var(--acc);color:var(--acc)}
.pnav button{width:27px;height:27px;border:1px solid var(--line);background:#fff;border-radius:50%;
  color:var(--ink2);font-size:12px;cursor:pointer;line-height:1}
.pnav button:hover{border-color:var(--acc);color:var(--acc)}
.pnav button:disabled{opacity:.35;cursor:default}
.pnav .pg{font-family:var(--serif);font-size:12px;color:var(--muted);padding:0 4px}

.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px 22px 21px;margin-bottom:16px}
.chd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.chd h2{font-family:var(--serif);font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:9px}
.chd h2 i{font-style:normal;font-size:11px;color:var(--acc);letter-spacing:.06em}
.chd .en{font-size:9.5px;letter-spacing:.2em;color:var(--muted)}

/* hero */
.hero{display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.hero-l{flex:0 0 232px;min-width:200px}
.hero-l .hl{font-size:10.5px;letter-spacing:.15em;color:var(--muted)}
.hero-l .hv{font-family:var(--serif);font-size:46px;line-height:1.05;font-weight:700;margin:6px 0 2px;color:var(--ink)}
.hero-l .hv s{text-decoration:none;font-size:15px;color:var(--muted);margin-left:6px;font-family:var(--sans)}
.hero-l .hv.na{font-size:26px;color:#b3aaa0}
.hero-l .vsub{font-size:11.5px;color:var(--ink2);line-height:1.7}

.verd{flex:1 1 320px;min-width:240px;align-self:center;display:flex;align-items:center;gap:10px;
  background:var(--acc-t);border:1px solid var(--acc-b);border-left:3px solid var(--acc);
  border-radius:8px;padding:13px 16px;font-size:15px;color:#8a3410;font-weight:600}
.vtext{margin-top:11px;font-size:12px;color:var(--ink2);line-height:1.85;white-space:pre-line}

/* guide table */
.gtw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.gt{width:100%;min-width:840px;border-collapse:collapse;font-size:12px;table-layout:fixed}
table.gt th{font-size:9.5px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-align:left;
  padding:0 10px 9px;border-bottom:1px solid var(--line);line-height:1.45}
table.gt td{padding:12px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.gt tr:last-child td{border-bottom:0}
table.gt tbody tr:hover{background:#fdfbf8}
.pb{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:20px;padding:0 7px;
  border-radius:5px;font-family:var(--serif);font-size:11.5px;font-weight:700;
  background:#f2f0ea;color:#6b6862;border:1px solid #e6e2d8}
.pb.p0{background:#fdece2;border-color:var(--acc-b);color:#b8410f}
.pb.p1{background:#eef4f8;border-color:#d8e5ee;color:#245673}
.pb.p2{background:#f0f2f5;border-color:#e0e4ea;color:#4a5560}
.gtype{font-size:11.5px;color:var(--ink2);line-height:1.55}
.gthr{font-family:var(--serif);font-size:14px}
.gthr i{font-style:normal;font-size:9.5px;color:var(--muted);font-family:var(--sans);margin-left:2px}
.gw{font-family:var(--serif);font-size:13px;color:var(--acc-d)}

.cgrid{display:flex;flex-wrap:wrap;gap:7px}
.cc{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;
  padding:4px 8px 4px 4px;background:#fdfcfa;min-width:0}
.cc .sw{width:17px;height:17px;border-radius:4px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.duo .cc{padding:5px 10px 5px 5px}
.cc .tx{font-size:11.5px;line-height:1.25}
.gt .gcol{vertical-align:top;background:#fdfbf7}
.gnote{font-size:10.5px;color:#8b9096;margin-bottom:9px;letter-spacing:.01em}
.gcol .prow:first-of-type{border-top:0;padding-top:0}
.prow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line2)}
.prow:first-child{border-top:0;padding-top:2px}
.plab{flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:.03em;padding-top:1px;font-family:var(--serif)}
.pbody{flex:1 1 auto;min-width:0}
.pdesc{display:flex;flex-wrap:wrap;align-items:baseline;gap:7px;margin-bottom:6px}
.pdesc b{font-size:11.5px;letter-spacing:.02em;color:var(--ink)}
.pdesc b::after{content:'·';margin-left:7px;color:#c3c8ce}
.pdesc span{font-size:10.5px;color:#8b9096}
.plab.p0{color:#b8410f}
.plab.p1{color:#245673}
.plab.p2{color:#5d6670}
.prow .cgrid{flex:1 1 auto;min-width:0}
.subp{margin-left:8px;font-size:10px;color:#8b9096;letter-spacing:.02em}
.cc .tx em{display:block;font-style:normal;font-size:9px;color:var(--muted);letter-spacing:.02em}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px}

.duo{display:flex;gap:18px;flex-wrap:wrap}
.duo > div{flex:1 1 320px;min-width:260px}
.duo .sub{font-size:10.5px;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-bottom:9px;
  display:flex;align-items:baseline;gap:8px}
.duo .sub b{font-family:var(--serif);font-size:13px;color:var(--ink);letter-spacing:0}
.ph{border:1px dashed #dcd6c9;background:#fbfaf7;border-radius:9px;padding:16px;text-align:center}
.ph b{display:block;font-size:11.5px;color:#7a7468;margin-bottom:5px}
.ph span{display:block;font-size:10.5px;color:var(--muted);line-height:1.75;max-width:30em;margin:0 auto}

.foot{margin-top:18px;font-size:10px;color:var(--muted);line-height:1.9;letter-spacing:.02em}
.foot b{color:#7a7468}

@media (max-width:1080px){ .main{padding:28px 24px 46px} .h1{font-size:31px} }
@media (max-width:900px){
  .shell{display:block}
  .rail{position:static;height:auto;flex:none;padding:16px 0 10px}
  .toc{display:flex;overflow-x:auto;gap:4px;padding:9px 12px 3px;flex:1 1 auto}
  .toc .grp{display:none}
  .ti{flex:0 0 auto;border-left:0;border-bottom:2px solid transparent;border-radius:6px;padding:5px 10px}
  .ti.on{border-left:0;border-bottom-color:var(--acc)}
  .ti .w{display:none}
  .rail-foot{display:none}
  .brand{padding:0 18px 10px;border-bottom:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .brand h2{font-size:16px;margin-top:0}
  .main{padding:20px 16px 40px}
  .hero-l{flex:1 1 100%;border-bottom:1px solid var(--line2);padding-bottom:14px}
  .verd{flex:1 1 100%;font-size:14px}
  table.gt{min-width:800px}
}
</style>
</head>

</div>

const ESC = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const fmt = v => {
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0$/,'');
};
const th = v => {
  const n = Number(String(v).replace(/,/g,''));
  return isFinite(n) ? n.toLocaleString('en-US') : String(v);
};

function firstLine(d){ return (d.concl || '').split('\n').filter(Boolean)[0] || ''; }
function restLines(d){ return (d.concl || '').split('\n').filter(Boolean).slice(1); }
function colorCount(d){
  let n = 0;
  ['P0','P1','P2'].forEach(k => { n += (d.colors && d.colors[k] ? d.colors[k].length : 0); });
  return n;
}

function guide(d){
  if (!d.hasGuide || !d.rows.length) {
    return `<div class="ph"><b>原文该品类无优先级清单</b><span>该品类未给出 P0–P5 时间档与推荐加色，本页不做补全。</span></div>`;
  }
  const card = c =>
    `<div class="cc"><span class="sw" style="background:${ESC(c.hex)}"></span>
      <span class="tx">${ESC(c.zh)}<em>${ESC(c.en || '')}</em></span></div>`;
  const DESC = {
    P0: ['先占主推位', n => `站内外都认，先铺这 ${n} 个`],
    P1: ['定向补缺口', () => '站内缺的颜色，有位置再补'],
    P2: ['差异化试色', () => '站外热门，挑得动的款式']
  };
  const groups = ['P0', 'P1', 'P2'].map(p2 => {
    const list = (d.colors && d.colors[p2]) || [];
    if (!list.length) return '';
    const [t, hint] = DESC[p2];
    return `<div class="prow"><span class="plab ${p2.toLowerCase()}">${p2}</span>
      <div class="pbody">
        <div class="pdesc"><b>${t}</b><span>${hint(list.length)}</span></div>
        <div class="cgrid">${list.map(card).join('')}</div>
      </div></div>`;
  }).join('');

  const merged = `<td class="gcol" rowspan="${d.rows.length}">

  let body = '';

    body += `<tr>
      <td><span class="pb ${cls}">${ESC(r.p)}</span></td>
      <td class="gtype">${ESC(r.range)}</td>
      <td class="gtype">${ESC(r.type)}</td>
      <td class="gthr">${ESC(r.thr)}</td>
      <td class="gw">${r.width ? ESC(r.width) : '—'}</td>
      ${idx === 0 ? merged : ''}

  });
  return `<div class="gtw"><table class="gt">

      <span><span class="dot" style="background:#9aa4b1"></span>P2 站外差异，只做试色</span>
    </div>`;
}

function outs(d){
  const p0 = (d.colors && d.colors.P0) || [];
  const p1 = (d.colors && d.colors.P1) || [];
  const p2 = (d.colors && d.colors.P2) || [];
  const sw = c => `<div class="cc"><span class="sw" style="background:${ESC(c.hex)}"></span>
     <span class="tx">${ESC(c.zh)}<em>${ESC(c.en || '')}</em></span></div>`;
  const grp = (p, list) => `<div class="prow">
      <span class="plab ${p.toLowerCase()}">${p}：</span>
      <div class="cgrid">${list.map(sw).join('')}</div>
    </div>`;
  const groups = arr => arr.filter(g => g.list.length).map(g => grp(g.p, g.list)).join('');

  const left = groups([{ p: 'P0', list: p0 }, { p: 'P2', list: p2 }]);
  const right = groups([{ p: 'P1', list: p1 }]);

  const outHtml = left || '<div class="ph"><b>原文该节无独立数据表</b><span>站外色彩趋势表体为空，仅以选色指南中的颜色体现，本页不另做排序或推断。</span></div>';
  const inHtml = right || '<div class="ph"><b>站内缺口原文未列明细</b><span>该品类选色指南只给并集与站外清单，未单列站内缺口色，本页不做补全。</span></div>';

  return `<div class="duo">
    <div><div class="sub">站外热门颜色 · 可直接复<b>${p0.length + p2.length} 色</b></div>${outHtml}</div>
    <div><div class="sub">站内缺口色 · 定向补<b>${p1.length} 色</b></div>${inHtml}</div>
  </div>`;
}

      <span class="gbtn" onclick="go('ov')">总览</span>
      <button onclick="goStep(-1)" ${i === 0 ? 'disabled' : ''}>←</button>
      <span class="pg">${String(i+1).padStart(2,'0')} / ${String(DATA.length).padStart(2,'0')}</span>
      <button onclick="goStep(1)" ${i === DATA.length - 1 ? 'disabled' : ''}>→</button>
    </div>
  </div>

  <div class="card">
    <div class="chd"><h2><i>01</i>品类颜色边际</h2><span class="en">MARGIN</span></div>
    <div class="hero">
      <div class="hero-l">
        <div class="hl">推荐复色宽度</div>
        ${d.width ? `<div class="hv">${ESC(d.width)}<s>色</s></div>` : `<div class="hv na">暂无</div>`}
        <div class="vsub">${d.noBoom ? '各档爆旺率均为 0，宽度参考站外口径' : '峰值后回落前最后一档即封顶'}</div>
      </div>
      <div class="verd">${ESC(verdict)}</div>
    </div>
    ${body ? `<div class="vtext">${ESC(body)}</div>` : ''}
  </div>

  <div class="card">
    <div class="chd"><h2><i>02</i>选色指南 · 优先级与推荐加色</h2><span class="en">GUIDE</span></div>
    ${guide(d)}
  </div>

  <div class="card">
    <div class="chd"><h2><i>03</i>站外热门 · 站内缺口</h2><span class="en">OUT / IN</span></div>
    ${outs(d)}
  </div>

  <div class="foot">数据取自原文表格，未做推断补全；原文中图表与空白单元格无文字数据之处，页面按原文标注为待补充。</div>`;
}

let CUR = 'ov';

function goStep(step){
  const n = Number(CUR) + Number(step);
  if (n >= 0 && n < DATA.length) go(n);
}

function go(k){
  CUR = k;
  const view = document.getElementById('view');
  if (k === 'ov') { view.innerHTML = overview(); rail('ov'); }
  else { view.innerHTML = category(Number(k)); rail(Number(k)); }
  window.scrollTo(0, 0);
}
go('ov');
</script>
</body>
</html>
